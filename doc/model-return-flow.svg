<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1478" viewBox="0 0 1250 1478" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a97ab"/>
  </marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c07b7b"/>
  </marker>
</defs>
<rect width="1250" height="1478" fill="#fbfcfe"/>
<text x="32" y="46" font-size="24" font-weight="700" fill="#16233a">选书插件：模型返回处理流程</text>
<text x="32" y="72" font-size="13.5" fill="#5b6b85">主链＝正常路径（右列）；左侧＝出错与重试路径。所有判断都在 lib/screening.js 与 index.js 里</text>
<text x="32" y="86" font-size="12.5" font-weight="700" fill="#8f1d1d">出错 / 重试</text>
<text x="452" y="86" font-size="12.5" font-weight="700" fill="#1e3a8a">正常路径</text>
<rect x="452" y="104" width="728" height="92" rx="10" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.4"/>
<rect x="452" y="104" width="728" height="30" rx="10" fill="#eef2ff"/>
<rect x="452" y="122" width="728" height="12" fill="#eef2ff"/>
<text x="466" y="124" font-size="14" font-weight="700" fill="#1e3a8a">① 送一批书给模型</text>
<text x="466" y="152" font-size="12.8" fill="#3d4a5f">来源：待判定优先 → 失败重试</text>
<text x="466" y="171" font-size="12.8" fill="#3d4a5f">批大小 5–40（默认 15）</text>
<rect x="452" y="222" width="728" height="92" rx="10" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.4"/>
<rect x="452" y="222" width="728" height="30" rx="10" fill="#eef2ff"/>
<rect x="452" y="240" width="728" height="12" fill="#eef2ff"/>
<text x="466" y="242" font-size="14" font-weight="700" fill="#1e3a8a">② 拼装请求</text>
<text x="466" y="270" font-size="12.8" fill="#3d4a5f">system = AI_RULES 规则全文</text>
<text x="466" y="289" font-size="12.8" fill="#3d4a5f">user = 10 字段 JSON（简介截 400 字）</text>
<rect x="452" y="340" width="728" height="92" rx="10" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.4"/>
<rect x="452" y="340" width="728" height="30" rx="10" fill="#eef2ff"/>
<rect x="452" y="358" width="728" height="12" fill="#eef2ff"/>
<text x="466" y="360" font-size="14" font-weight="700" fill="#1e3a8a">③ llm.stream 调用默认模型</text>
<text x="466" y="388" font-size="12.8" fill="#3d4a5f">temperature 0 · maxTokens 16000</text>
<text x="466" y="407" font-size="12.8" fill="#3d4a5f">240 秒超时，可取消</text>
<rect x="452" y="458" width="728" height="92" rx="10" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.4"/>
<rect x="452" y="458" width="728" height="30" rx="10" fill="#eef2ff"/>
<rect x="452" y="476" width="728" height="12" fill="#eef2ff"/>
<text x="466" y="478" font-size="14" font-weight="700" fill="#1e3a8a">④ 流式拼文本</text>
<text x="466" y="506" font-size="12.8" fill="#3d4a5f">text-delta 按 index 累积</text>
<text x="466" y="525" font-size="12.8" fill="#3d4a5f">block-end 整块兜底（不发 delta 的 provider）</text>
<path d="M 816 576 L 1180 608 L 816 640 L 452 608 Z" fill="#fff8ec" stroke="#e0b56b" stroke-width="1.4"/>
<text x="816" y="613" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5300">finish = error / 文本为空？</text>
<rect x="452" y="666" width="728" height="92" rx="10" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.4"/>
<rect x="452" y="666" width="728" height="30" rx="10" fill="#eef2ff"/>
<rect x="452" y="684" width="728" height="12" fill="#eef2ff"/>
<text x="466" y="686" font-size="14" font-weight="700" fill="#1e3a8a">⑤ parseScreeningJson 容错解析</text>
<text x="466" y="714" font-size="12.8" fill="#3d4a5f">去 ``` 围栏 → 取第一个 { 到最后一个 }</text>
<text x="466" y="733" font-size="12.8" fill="#3d4a5f">原样 → 去尾逗号 → 中文引号替换</text>
<path d="M 816 784 L 1180 816 L 816 848 L 452 816 Z" fill="#fff8ec" stroke="#e0b56b" stroke-width="1.4"/>
<text x="816" y="821" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5300">解析成功？</text>
<rect x="452" y="874" width="728" height="92" rx="10" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.4"/>
<rect x="452" y="874" width="728" height="30" rx="10" fill="#eef2ff"/>
<rect x="452" y="892" width="728" height="12" fill="#eef2ff"/>
<text x="466" y="894" font-size="14" font-weight="700" fill="#1e3a8a">⑥ 归一化为三个桶</text>
<text x="466" y="922" font-size="12.8" fill="#3d4a5f">passed / rejected / review</text>
<text x="466" y="941" font-size="12.8" fill="#3d4a5f">非数组当空，非对象元素丢弃</text>
<rect x="452" y="992" width="728" height="92" rx="10" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.4"/>
<rect x="452" y="992" width="728" height="30" rx="10" fill="#eef2ff"/>
<rect x="452" y="1010" width="728" height="12" fill="#eef2ff"/>
<text x="466" y="1012" font-size="14" font-weight="700" fill="#1e3a8a">⑦ applyOutcome 贴回书</text>
<text x="466" y="1040" font-size="12.8" fill="#3d4a5f">序号队列认领（重复序号各领一本）</text>
<text x="466" y="1059" font-size="12.8" fill="#3d4a5f">题名兜底 · seen 去重 · 写 status/source/reason</text>
<rect x="452" y="1110" width="728" height="92" rx="10" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.4"/>
<rect x="452" y="1110" width="728" height="30" rx="10" fill="#eef2ff"/>
<rect x="452" y="1128" width="728" height="12" fill="#eef2ff"/>
<text x="466" y="1130" font-size="14" font-weight="700" fill="#1e3a8a">⑧ 兜底：批内未被认领的书</text>
<text x="466" y="1158" font-size="12.8" fill="#3d4a5f">status = review</text>
<text x="466" y="1177" font-size="12.8" fill="#3d4a5f">reason =「模型未给出判定，转入待复审」</text>
<rect x="452" y="1228" width="728" height="92" rx="10" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.4"/>
<rect x="452" y="1228" width="728" height="30" rx="10" fill="#eef2ff"/>
<rect x="452" y="1246" width="728" height="12" fill="#eef2ff"/>
<text x="466" y="1248" font-size="14" font-weight="700" fill="#1e3a8a">⑨ 落盘 + 刷新</text>
<text x="466" y="1276" font-size="12.8" fill="#3d4a5f">每批 revision++ → history/&lt;id&gt;.json</text>
<text x="466" y="1295" font-size="12.8" fill="#3d4a5f">前端每秒轮询 counts/job，行数据 3 秒</text>
<rect x="32" y="104" width="364" height="92" rx="10" fill="#fff6f6" stroke="#e6a3a3" stroke-width="1.4"/>
<rect x="32" y="104" width="364" height="30" rx="10" fill="#fde4e4"/>
<rect x="32" y="122" width="364" height="12" fill="#fde4e4"/>
<text x="46" y="124" font-size="14" font-weight="700" fill="#8f1d1d">抛错（保留原文）</text>
<text x="46" y="152" font-size="12.8" fill="#3d4a5f">模型调用失败：… / 没有返回任何文本 /</text>
<text x="46" y="171" font-size="12.8" fill="#3d4a5f">不是合法 JSON（可能被截断）</text>
<rect x="32" y="222" width="364" height="92" rx="10" fill="#fff6f6" stroke="#e6a3a3" stroke-width="1.4"/>
<rect x="32" y="222" width="364" height="30" rx="10" fill="#fde4e4"/>
<rect x="32" y="240" width="364" height="12" fill="#fde4e4"/>
<text x="46" y="242" font-size="14" font-weight="700" fill="#8f1d1d">screenBatch 错误分类</text>
<text x="46" y="270" font-size="12.8" fill="#3d4a5f">可恢复＝空文本 · JSON · 找不到 JSON</text>
<text x="46" y="289" font-size="12.8" fill="#3d4a5f">且 books &gt; 1 且 depth &lt; 3</text>
<path d="M 214 340 L 396 372 L 214 404 L 32 372 Z" fill="#fff8ec" stroke="#e0b56b" stroke-width="1.4"/>
<text x="214" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5300">可恢复？</text>
<rect x="32" y="430" width="364" height="92" rx="10" fill="#f4fbf7" stroke="#9dcdb4" stroke-width="1.4"/>
<rect x="32" y="430" width="364" height="30" rx="10" fill="#e0f4e9"/>
<rect x="32" y="448" width="364" height="12" fill="#e0f4e9"/>
<text x="46" y="450" font-size="14" font-weight="700" fill="#155e3b">对半拆批并行重试</text>
<text x="46" y="478" font-size="12.8" fill="#3d4a5f">15 → 8+7 → 4+4 …（最多 3 层）</text>
<text x="46" y="497" font-size="12.8" fill="#3d4a5f">单本仍失败即放弃</text>
<rect x="32" y="548" width="364" height="111" rx="10" fill="#fff6f6" stroke="#e6a3a3" stroke-width="1.4"/>
<rect x="32" y="548" width="364" height="30" rx="10" fill="#fde4e4"/>
<rect x="32" y="566" width="364" height="12" fill="#fde4e4"/>
<text x="46" y="568" font-size="14" font-weight="700" fill="#8f1d1d">整批判「失败」</text>
<text x="46" y="596" font-size="12.8" fill="#3d4a5f">status = failed</text>
<text x="46" y="615" font-size="12.8" fill="#3d4a5f">reason =「AI 判定失败：&lt;原文&gt;」</text>
<text x="46" y="634" font-size="12.8" fill="#3d4a5f">job.failed += batch.length</text>
<rect x="32" y="685" width="364" height="92" rx="10" fill="#f4fbf7" stroke="#9dcdb4" stroke-width="1.4"/>
<rect x="32" y="685" width="364" height="30" rx="10" fill="#e0f4e9"/>
<rect x="32" y="703" width="364" height="12" fill="#e0f4e9"/>
<text x="46" y="705" font-size="14" font-weight="700" fill="#155e3b">下一轮再处理</text>
<text x="46" y="733" font-size="12.8" fill="#3d4a5f">待判定清空后按钮变「重试失败书目」</text>
<text x="46" y="752" font-size="12.8" fill="#3d4a5f">运行前快照，不重复打同一批</text>
