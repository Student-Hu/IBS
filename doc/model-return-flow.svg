<path d="M 214 404 L 214 428" fill="none" stroke="#c07b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 214 522 L 214 546" fill="none" stroke="#c07b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 214 659 L 214 683" fill="none" stroke="#c07b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M 396 372 L 404 372 L 404 603.5 L 398 603.5" fill="none" stroke="#c07b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="408" y="365" font-size="12" font-weight="600" fill="#a15555">否</text>
<text x="384" y="422" text-anchor="end" font-size="12" font-weight="600" fill="#3f7a5c">是</text>
<path d="M 396 476 L 414 476 L 414 920 L 450 920" fill="none" stroke="#3f8f66" stroke-width="1.6" marker-end="url(#a)"/>
<text x="418" y="491" font-size="12" font-weight="600" fill="#3f7a5c">重试成功</text>
<path d="M 1180 1274 L 1216 1274 L 1216 150 L 1182 150" fill="none" stroke="#8a97ab" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="1208" y="712" transform="rotate(-90 1208 712)" text-anchor="middle" font-size="12" fill="#6b7a92">下一批（job.phase: pending → retry）</text>
<line x1="32" y1="1406" x2="1218" y2="1406" stroke="#e3e8f0"/>
<text x="32" y="1432" font-size="12.5" fill="#5b6b85">契约：模型只输出一个 JSON 对象 {"passed":[…],"rejected":[…],"review":[…]}；每条含 序号 / 题名 / 通过理由·排除原因·待复审原因，一本只能落一个桶。</text>
<text x="32" y="1454" font-size="12.5" fill="#5b6b85">取消只停「当前批之后」的批次，已判结果保留；每批结束都会 revision++ 并写 history/&lt;id&gt;.json，所以刷新/换会话都能接着看。</text>
</svg>