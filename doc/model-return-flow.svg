<path d="M 452 608 L 430 608 L 430 150 L 398 150" fill="none" stroke="#c07b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="424" y="602" text-anchor="end" font-size="12" font-weight="600" fill="#a15555">是</text>
<path d="M 452 816 L 442 816 L 442 150 L 398 150" fill="none" stroke="#c07b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="436" y="810" text-anchor="end" font-size="12" font-weight="600" fill="#a15555">否</text>
<path d="M 214 196 L 214 220" fill="none" stroke="#c07b7b" stroke-width="1.6" marker-end="url(#ar)"/>
